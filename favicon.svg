<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6.4" fill="#0a0a0a"/>
  <!-- S letter: top bar + left side = white, middle + right side + bottom = red -->
  <!-- Top horizontal -->
  <rect x="7" y="7" width="18" height="3" rx="1.5" fill="#f5f5f5"/>
  <!-- Left vertical (top half) -->
  <rect x="7" y="7" width="3" height="10" rx="1.5" fill="#f5f5f5"/>
  <!-- Middle bar -->
  <rect x="7" y="14.5" width="18" height="3" rx="1.5" fill="#ff3b30"/>
  <!-- Right vertical (bottom half) -->
  <rect x="22" y="17.5" width="3" height="7.5" rx="1.5" fill="#ff3b30"/>
  <!-- Bottom horizontal -->
  <rect x="7" y="22" width="18" height="3" rx="1.5" fill="#ff3b30"/>
</svg>
